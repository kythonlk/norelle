[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "http://76.13.221.75:9488/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "http://76.13.221.75:9488/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "http://76.13.221.75:9488/media/:splat"
  status = 200
  force = true
